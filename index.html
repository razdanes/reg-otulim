<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Otulim – panel zamówień</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&display=swap">
<style>
:root{--bg:#f6f0e8;--card:#fffdf9;--tx:#3a2e2a;--mut:#8a7a70;--bd:#e8dccd;--ac:#a8445a;--acx:#fff;--th:#f0e4d4;--tht:#5b463a;--sh:0 2px 10px rgba(90,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1816;--card:#2a2320;--tx:#f3e9df;--mut:#b0a094;--bd:#433830;--ac:#e08a9c;--acx:#2a1a1e;--th:#3a2f29;--tht:#e9d9c8;--sh:0 2px 12px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#1d1816;--card:#2a2320;--tx:#f3e9df;--mut:#b0a094;--bd:#433830;--ac:#e08a9c;--acx:#2a1a1e;--th:#3a2f29;--tht:#e9d9c8;--sh:0 2px 12px rgba(0,0,0,.35)}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:1500px;margin:0 auto}
h1{font:600 26px/1.1 "Zilla Slab",Georgia,serif;margin:0;display:flex;align-items:center;gap:12px;letter-spacing:.5px}
h1 img{width:48px;height:48px;border-radius:50%}h1 small{display:block;font:12px system-ui,sans-serif;color:var(--mut);letter-spacing:0;margin-top:3px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:7px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.s{padding:3px 7px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:12px}
.card{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.card>span{font-size:26px}.card b{font:600 24px "Zilla Slab",Georgia,serif}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{white-space:nowrap;border-radius:999px;padding:4px 11px;font-size:12px}
.chip.on{outline:2px solid var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.bar input{flex:1;min-width:150px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th{background:var(--th);color:var(--tht);font-size:12px;letter-spacing:.3px;text-transform:uppercase;text-align:center;padding:9px 6px;position:sticky;top:0}
td{border-top:1px solid var(--bd);padding:8px 6px;vertical-align:middle}
tbody tr:hover td{background:rgba(168,68,90,.06)}
td.c{text-align:center}
.pill{border-radius:999px;padding:4px 8px;font-size:12px;max-width:200px;font-weight:500}
.mut{color:var(--mut);font-size:12px}
.sum{margin:10px 2px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(40,25,20,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:14px;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:660px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.g .f{grid-column:1/-1}
.g input,.g select,.g textarea{width:100%}
.doc{background:#fff;color:#111;padding:28px;font-family:Roboto,Arial,sans-serif;font-size:14px;line-height:1.6;max-width:760px;margin:0 auto;border-radius:6px}
.doc h2{font-size:20px;margin:0 0 24px}.doc h4{margin:18px 0 6px}.doc ul{margin:4px 0}
.doc table{min-width:0;width:100%}.doc td,.doc th{border:1px solid #bbb;padding:5px;color:#111;background:none;position:static;text-transform:none;font-size:14px;letter-spacing:0}
.doc .logo{width:240px;height:auto;display:block;margin:0 0 6px;background:#fff}
.doc .sig{text-align:right;margin-top:24px}.doc .sig img{max-height:70px;display:block;margin-left:auto}
@media print{body>*:not(#docov){display:none!important}#docov{position:static;display:block!important;background:none;padding:0;backdrop-filter:none}.noprint{display:none!important}.doc{box-shadow:none;max-width:none}}
</style></head><body>
<div class="top"><h1><img id="hl" alt=""><span>Otulim<small>rejestr zamówień · handmade</small></span></h1>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="p" onclick="edit()">+ Nowe zamówienie</button><button onclick="csv()">⬇ Eksport CSV</button><button onclick="bk()">⬇ Kopia JSON</button><button onclick="document.getElementById('imp').click()">⬆ Import</button><button id="cl" onclick="cloudClick()">☁ Dysk Google</button><button onclick="cfgOpen()">⚙ Ustawienia</button></div></div>
<input type="file" id="imp" accept=".json,.csv,.xlsx,.xls,.xlsm,.xlsb,.ods,text/csv" hidden onchange="imp(this)">
<div class="cards" id="cards"></div>
<div class="chips" id="chips"></div>
<div class="bar"><input id="q" placeholder="Szukaj: klient, produkt, haft…" oninput="draw()"><select id="fs" onchange="draw()"></select></div>
<div class="wrap"><table><thead><tr><th>Data zam.</th><th>Źródło</th><th>Dane klienta</th><th>Adres</th><th>Produkt</th><th>Haft</th><th>Ilość</th><th>Cena</th><th>Data realizacji</th><th>Status</th><th>Szczegóły</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="sum" id="sum"></div>
<div class="mut">Dane są zapisane w tej przeglądarce. Rób regularnie „Kopię” (plik JSON).</div>

<div class="ov" id="ov"><div class="box" id="box"></div></div>
<div class="ov" id="docov"><div style="width:100%;max-width:780px"><div class="noprint" style="display:flex;gap:8px;margin-bottom:8px"><button class="p" onclick="window.print()">Drukuj / zapisz PDF</button><button onclick="closeDoc()">Zamknij</button></div><div class="doc" id="doc"></div></div></div>

async function dapi(u,o){o=o||{};o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});const x=await fetch(u,o);if(x.status===401){tok=null;throw new Error('sesja wygasła, kliknij ☁')}if(!x.ok)throw new Error('Dysk: '+x.status);return x}
async function findF(){const x=await dapi('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+encodeURIComponent("name='otulim-baza.json' and trashed=false"));return((await x.json()).files||[])[0]||null}
async function push(){const body=JSON.stringify(S),f=fileId?{id:fileId}:await findF();if(f){await dapi('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});fileId=f.id}else{const bd='otulim'+Date.now(),mp=`--${bd}\r\nContent-Type: application/json\r\n\r\n{"name":"otulim-baza.json","mimeType":"application/json"}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;const x=await dapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});fileId=(await x.json()).id}}
async function auto(){if(!tok)return setCl('Synchronizuj (kliknij)');try{await push();setCl('Zapisano '+tm())}catch(e){setCl('Błąd: '+e.message)}}
async function sync(){try{setCl('Łączenie…');if(!tok)await gtoken();const f=await findF();if(f){fileId=f.id;const d=await(await dapi('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).json();if((d.u||0)>(S.u||0)&&confirm('Na Dysku Google są nowsze dane ('+new Date(d.u).toLocaleString('pl-PL')+').\nOK = wczytaj je z Dysku\nAnuluj = nadpisz Dysk danymi z tego urządzenia')){S=d;fix();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}draw();setCl('Wczytano '+tm());return}}await push();setCl('Zsynchronizowano '+tm())}catch(e){setCl('Błąd: '+e.message)}}

function parseCsv(t){t=t.replace(/^\ufeff/,'');const s=t.slice(0,3000),d=(s.match(/;/g)||[]).length>(s.match(/,/g)||[]).length?';':',';let R=[],w=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==d){w.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;w.push(c);c='';R.push(w);w=[]}else c+=ch}if(c||w.length){w.push(c);R.push(w)}return R}
const isoD=v=>{v=(v||'').trim();const m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):/^\d{4}-\d{2}-\d{2}$/.test(v)?v:''};
const num=v=>{const x=parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'));return isNaN(x)?'':x};

function impCsv(t){impRows(parseCsv(t))}
function impRows(R){const hi=R.findIndex(r=>r.some(c=>/^produkt$/i.test(c.trim())));if(hi<0)return alert('Nie znaleziono nagłówków (kolumna „Produkt”).');const K2=R[hi].map(c=>MAP[c.trim().toLowerCase()]||null),L=[];R.slice(hi+1).forEach(r=>{const o={};K2.forEach((k,i)=>{if(k)o[k]=(r[i]||'').trim()});if(!o.product&&!o.client&&!o.embroidery)return;L.push({id:0,date:isoD(o.date),source:pick(SRC,o.source,'Inne'),client:o.client||'',contact:o.contact||'',address:o.address||'',product:o.product||'',embroidery:o.embroidery||'',qty:num(o.qty),price:num(o.price),courier:o.courier||'',shipCost:num(o.shipCost),pay:pick(PAY,o.pay,'Przelew'),ship:/^odb/i.test(o.ship||'')?'odbiór':'wysyłka',lead:S.cfg.lead,due:isoD(o.due),status:stM(o.status),details:o.details||''})});if(L.length&&confirm('Dodać '+L.length+' zamówień do bazy?')){L.forEach(o=>{o.id=++S.seq;S.orders.push(o)});save();draw()}else if(!L.length)alert('Brak wierszy do zaimportowania.')}
function imp(el){const f=el.files[0];if(!f)return;const x=/\.(xlsx|xls|xlsm|xlsb|ods)$/i.test(f.name),r=new FileReader();r.onload=()=>{try{if(x){if(!window.XLSX)return alert('Nie załadowano obsługi Excela (brak internetu?). Zapisz plik jako CSV i wczytaj ponownie.');const wb=XLSX.read(r.result,{type:'array'});let R=[];for(const n of wb.SheetNames){const A=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,dateNF:'dd.mm.yyyy',defval:''}).map(w=>w.map(c=>String(c==null?'':c)));if(A.some(w=>w.some(c=>/^produkt$/i.test(c.trim())))){R=A;break}}impRows(R)}else if(/^\s*\{/.test(r.result)){const d=JSON.parse(r.result);if(d.orders&&confirm('Zastąpić obecne dane kopią?')){S=d;fix();S.seq=S.seq||d.orders.reduce((a,o)=>Math.max(a,o.id||0),0);save();draw()}}else impCsv(r.result)}catch(e){alert('Nieprawidłowy plik')}el.value=''};x?r.readAsArrayBuffer(f):r.readAsText(f)}
$('hl').src=LOGO;if(gid())setCl('Synchronizuj');draw();
</script></body></html>
